<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Contact
    </title>

    <meta name="description" content="Contact me if you need help with frontend development">
    
    <meta property="og:title" content="Contact">
    <meta property="og:description" content="Get in touch with me for frontend development opportunities">
    <meta property="og:url" content="index.html">

    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
</head>
<body>
    <header>
        <div>
            <img src="images/favicon.png" alt="logo">
            <span>Your Name</span>
        </div>

        <nav>
            <a href="homepage.html">Home</a> /
            <a href="projects.html">Project</a> /
            <a href="articles.html">Articles</a> /
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h1>
            Contact with me
        </h1>
        <section id="contact">
            <h2>Send me a message</h2>
            <form action="#" method="post">
                <div>
                    <label for="username">Your name:</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your name"
                        required>
                </div>
                
                <div>
                    <label for="email">Your email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required>
                </div>
                
                <div>
                    <label for="description">Description:</label>
                    <textarea 
                        id="description" 
                        name="description" 
                        rows="4" 
                        cols="50" 
                        placeholder="Enter description here..."
                        required></textarea>
                </div>
                
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; all rights reserved 2026</p>
    </footer>
</body>
</html>
