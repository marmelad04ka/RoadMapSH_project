<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Contact form
    </title>

</head>
<body>
    <header>
        <p><strong>Acme Support</strong></p>
        <nav>
            <a href="#">Home</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <h1>Contact us</h1>
        <p>Send a message and we will get back to you</p>
        <form action="/submit" method="post">
            <label for="username">Full name</label>
            <input
                type="text" 
                id="username" 
                name="username"
                required>
            <br>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
            <br>

            <label for="subjects">Subject</label>
            <select id="subjects" name="subjects">
                <option value="support">Support</option>
                <option value="sales">Sales</option>
                <option value="suggestions">Suggestions</option>
            </select>
            <br>

            <label for="message">Message</label>
            <textarea
                name="message"
                id="message"
                cols="40"
                maxlength="10000"
                minlength="5"
                required></textarea>
            <br>

            <fieldset>
                <legend>How did you hear about us?</legend>

                <input
                    type="radio"
                    id="source_search"
                    name="source"
                    value="search"
                    required
                    />
                <label for="source_search">Search</label>
                <br>

                <input
                    type="radio"
                    id="source_friend"
                    name="source"
                    value="friend"
                    />
                <label for="source_friend">Friend</label>
                <br>

                <input
                    type="radio"
                    id="source_social_media"
                    name="source"
                    value="social_media"
                    />
                <label for="source_social_media">Social media</label>
            </fieldset> 
            
            <input
                type="checkbox"
                id="send_product_update"
                name="send_product_update"
                value="yes">
            <label for="send_product_update">Send me product updates</label>
            <br>

            <button type="submit">Send message</button>
        </form>
    </main>
</body>
</html>
