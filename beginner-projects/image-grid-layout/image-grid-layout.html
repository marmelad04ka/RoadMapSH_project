<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Image Grid Layout
    </title>

    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="grid-container">
        <div class="image-container">
            <div class="left-column-container">
                <div class="left-big-image-container">
                    <img src="images/mountain.jpg">
                </div>  
                <div class="left-small-image-container">
                    <img src="images/room.jpg">
                </div>
            </div>

            <div class="center-column-container">
                <div class="center-small-image-container">
                    <img src="images/food.png">
                </div>  
                <div class="center-big-image-container">
                    <img src="images/door.jpg">
                </div>
            </div>
            
            <div class="right-column-container">
                <div class="right-big-image-container">
                    <img src="images/houses.jpg">
                </div>  
                <div class="right-small-image-container">
                    <img src="images/beach.png">
                </div> 
            </div>
            
        </div>
        
    </div>
</body>
</html>
