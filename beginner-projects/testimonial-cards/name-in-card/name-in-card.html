<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name in card</title>
    <link rel="stylesheet" href="src/name-in-card-style.css">
</head>
<body>
    <figure class="card">
        <blockquote class="card-body">
            <p class="main-text">I lived in this village until I was 12. Later, I learned that the leadership had ordered my brother to kill everyone in the clan and declared him a renegade ninja. Beasts.</p>
        </blockquote>
        <figcaption class="card-people-container">
            <div class="image-container">
                <img src="images/sasuke.png" alt="Sasuke Uchiha" loading="lazy">
            </div>
            <div class="people-info-container">
                <cite class="people-name">Sasuke Uchiha</cite>
                <span class="job-title">Akatsuki member</span>
            </div>
        </figcaption>
    </figure>
</body>
</html>
