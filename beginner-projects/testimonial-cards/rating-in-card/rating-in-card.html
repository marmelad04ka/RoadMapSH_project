<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating in card</title>
    <link rel="stylesheet" href="src/rating-in-card-style.css">
</head>
<body>
    <figure class="card">

        <div class="img-container">
            <img src="images/naruto.png" alt="Naruto Uzumaki" loading="lazy">
        </div>

        <figcaption class="main-info-container">

            <div class="rating-container">
                <p class="rating" aria-label="5 out of 5 stars">⭐⭐⭐⭐⭐</p>
            </div>

            <div class="people-info-container">
                <cite class="people-name">Naruto Uzumaki </cite>
                <span class="job-title">Future Hokage</span>
            </div>

            <blockquote class="card-body">
                <p class="main-text">I've lived in this village since birth. They gave me a free apartment, taught me the ways of the ninja, and fed me delicious ramen. I love it!</p>
            </blockquote>
            
        </figcaption>
    </figure>
</body>
</html>
