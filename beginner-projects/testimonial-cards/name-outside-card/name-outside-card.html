<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name outside card</title>
    <link rel="stylesheet" href="src/name-outside-card-style.css">
</head>
<body>
    <figure class="card">
        <blockquote class="card-body">
            <p class="main-text">I lived in this village until I was 13. I rose to the rank of captain in a secret unit. On orders from the head of ANBU, I wiped out my entire clan and left the village.</p>
            <footer class="conclusion">I do not recommend!</footer>
        </blockquote>
        <figcaption class="card-people-container">
            <div class="image-container">
                <img src="images/itachi.png" alt="Itachi Uchiha" loading="lazy">
            </div>
            <div class="people-info-container">
                <cite class="people-name">Itachi Uchiha</cite>
                <span class="job-title">ANBU Squad captain</span>
            </div>
        </figcaption>
    </figure>
</body>
</html>
