<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List review</title>

    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <figure class="card">
        <figcaption class="main-info-container">
            <blockquote class="card-body">
                <p class="main-text">
                    I've lived in this village since birth. 
                    They gave me a free apartment, taught me the ways of the ninja, and fed me delicious ramen. 
                    I love it!I've lived in this village since birth. 
                    They gave me a free apartment, taught me the ways of the ninja, and fed me delicious ramen. 
                    I love it!I've lived in this village since birth. 
                    They gave me a free apartment, taught me the ways of the ninja, and fed me delicious ramen. 
                    I love it!
                </p>
            </blockquote>

            <div class="list-reviews">
                <div class="button-left-container">
                    <button class="button-left" aria-label="Previous review">
                        ‹
                    </button>
                </div>
                
                <div class="avatars-slider" role="list">
                    <div class="avatar-item-faded-left" role="listitem">
                        <img src="images/itachi.png" alt="Review from Itachi Uchiha" loading="lazy">  
                    </div>

                    <div class="avatar-item-active" role="listitem">
                        <img src="images/naruto.png" alt="Review from Naruto Uzumaki" loading="lazy">
                    </div> 

                    <div class="avatar-item-faded-right" role="listitem">
                        <img src="images/sasuke.png" alt="Review from Sasuke Uchiha" loading="lazy">
                    </div>
                </div>

                <div class="button-right-container">
                    <button class="button-right" aria-label="Next review">
                        ›
                    </button>
                </div>
            </div>
            <cite class="people-name">Naruto Uzumaki </cite>
        </figcaption>
    </figure>
</body>
</html>
