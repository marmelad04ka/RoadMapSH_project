<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        Theme Switcher
    </title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <input type="radio" name="theme" id="light" checked>
    <input type="radio" name="theme" id="dark">
    <input type="radio" name="theme" id="custom">
    
    <div class="test-card-container">
       <div class="theme-name-container">
            

            <label class="label-light" for="light">Light</label>
            <label class="label-dark" for="dark">Dark</label>
            <label class="label-custom" for="custom">Custom</label>
       </div>
       
       <div class="text-header-container">
            Hello, World!
       </div>

       <div class="text-footer-container">
            This is a simple card that changes theme with CSS variables.
       </div>

       <div class="primary-button-container">
            <button>Primary button</button>
       </div>
    </div>
</body>
</html>
