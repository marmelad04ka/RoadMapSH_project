<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        GitHub Random Repository
    </title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="random-gh-repo-container">
        <div class="header-container">
            <div class="black-sq-container">

            </div>

            <div class="text-header-container">
                GitHub Repository Finder
            </div>
        </div>

        <div class="dropdown-container">
            <div class="input-dropdown-container">
                <input
                    placeholder="Select a Language"
                    readonly
                >
                <div class="triangle-container">
                    <span>⌄</span>
                </div>
            </div>

            <div class="choose-dropdown-container hidden">
                <ul>
                    <li class='dropdown_menu_item'>
                        test
                    <div class="check-mark-container hidden">
                        <span>✓</span>
                    </div>
                    </li>
                    <li class='dropdown_menu_item'>
                        test
                    <div class="check-mark-container hidden">
                        <span>✓</span>
                    </div>
                </li>
                </ul>
            </div>
        </div>

        <div class="main-info-container">
            <div class="info-container">
            </div>

            <div class="content-container hidden">
                <div class="header-content-container">
                    <div class="name-repo-container">
                    </div>
                    <div class="turned-triangle-container">
                        <span>⌄</span>
                    </div>
                </div>
                
                <div class="main-text-container">
                </div>

                <div class="footer-container">
                    <div class="language-container">
                        <div class="color-circle-container">
                            ●
                        </div>
                        <div class="language-name-container">
                        </div>
                    </div>

                    <div class="stars-container">
                        <div class="stars-symbol-container">
                            ★
                        </div>
                        <div class="stars-count-container">
                        </div>
                    </div>

                    <div class="fork-container">
                        <div class="fork-symbol-container">
                            ⑂
                        </div>
                        <div class="fork-count-container">
                        </div>
                    </div>

                    <div class="issue-container">
                        <div class="issue-symbol-container">
                            ⚠
                        </div>
                        <div class="issue-count-container">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-container">
            <button></button>
        </div>
    </div>
    <script type="module" src="src/js/script.js"></script>
</body>
</html>
