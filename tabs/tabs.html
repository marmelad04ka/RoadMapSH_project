<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Tabs
    </title>

    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="content-container">
        <div class="tabs-container">
            <div class="first-tab-container active" id="first-tab">
                First Tab
            </div>
            <div class="second-tab-container" id="second-tab">
                Second Tab
            </div>
            <div class="third-tab-container" id="third-tab">
                Third Tab
            </div>
            <div class="fourth-tab-container" id="fourth-tab">
                Fourth Tab
            </div>
        </div>

        <div class="text-for-tab-container">
            <div class="text-header-container">
                Clicking each tab should hide the content of the other tab and show the content of clicked teb.
                By default, enable the first tab.
            </div>
            
            <div class="text-center-container" >
                <span id="tab-text">First Tab content to be displayed here.</span>
                
            </div>

            <div class="text-footer-container">
                Add some dummy content or just a simple text showing the tab
            </div>
        </div>
    </div>
    <script src="src/js/script.js"></script>
</body>
</html>
